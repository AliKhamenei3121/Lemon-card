<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador - Análisis de Ciberseguridad</title>
    <!-- Tailwind CSS (Framework que suelen usar este tipo de paneles rápidos) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-2xl">
        <h2 class="text-xl font-bold text-center mb-4 text-emerald-400">INTERFAZ DESCUENTOS PERU</h2>
        <p class="text-xs text-zinc-400 text-center mb-6">Personaliza los datos de tu generador (Entorno de pruebas)</p>

        <!-- Controles de entrada (Inputs reactivos) -->
        <div class="space-y-4 mb-6">
            <div>
                <label class="block text-xs text-zinc-400 mb-1">Monto (S/)</label>
                <input type="text" id="montoInput" value="10.00" oninput="sincronizar()" class="w-full bg-zinc-800 border border-zinc-700 rounded p-2 text-sm focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs text-zinc-400 mb-1">Nombre del Destinatario</label>
                <input type="text" id="nombreInput" value="Rosa Rojas" oninput="sincronizar()" class="w-full bg-zinc-800 border border-zinc-700 rounded p-2 text-sm focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs text-zinc-400 mb-1">Método</label>
                <select id="destinoSelect" onchange="sincronizar()" class="w-full bg-zinc-800 border border-zinc-700 rounded p-2 text-sm focus:outline-none focus:border-emerald-500">
                    <option value="YAPE">YAPE</option>
                    <option value="PLIN">PLIN</option>
                </select>
            </div>
        </div>

        <!-- Contenedor de la Plantilla Simulada (Visual Preview) -->
        <div class="relative w-full aspect-[9/16] bg-zinc-950 rounded-xl overflow-hidden border border-zinc-800 flex flex-col justify-between p-6 shadow-inner">
            <!-- Simulación del encabezado de la app -->
            <div class="flex flex-col items-center mt-4">
                <div class="w-12 h-12 bg-emerald-500/20 border border-emerald-500 rounded-full flex items-center justify-center text-emerald-400 text-xl font-bold mb-2">✓</div>
                <span class="text-sm font-medium text-zinc-200">¡Lemoneaste!</span>
                <span class="text-3xl font-extrabold text-white mt-1">S/<span id="outMonto">10.00</span></span>
                <span id="outNombre" class="text-sm font-semibold text-zinc-300 mt-1">Rosa Rojas</span>
                <span class="text-[10px] text-zinc-500 mt-0.5">22 oct 2026 - 11:19 AM.</span>
            </div>

            <!-- Detalles inferiores de la constancia -->
            <div class="bg-zinc-900/80 rounded-lg p-3 space-y-2 text-xs border border-zinc-800/50">
                <div class="flex justify-between text-zinc-400">
                    <span>N° de celular</span>
                    <span class="text-zinc-200">*** *** 067</span>
                </div>
                <div class="flex justify-between text-zinc-400">
                    <span>Destino</span>
                    <span id="outDestino" class="text-zinc-200 font-bold">YAPE</span>
                </div>
                <div class="flex justify-between text-zinc-400">
                    <span>N° de operación</span>
                    <span class="text-zinc-200">2026...44672</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Función que replica el enlace de datos en tiempo real del DOM original
        function sincronizar() {
            document.getElementById('outMonto').innerText = document.getElementById('montoInput').value;
            document.getElementById('outNombre').innerText = document.getElementById('nombreInput').value;
            document.getElementById('outDestino').innerText = document.getElementById('destinoSelect').value;
        }
    </script>
</body>
</html>
