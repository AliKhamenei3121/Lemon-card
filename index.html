<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Comprobante (Análisis Local)</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 320px;
            text-align: center;
        }
        .receipt {
            background: #000000;
            border-radius: 16px;
            padding: 20px;
            margin-top: 15px;
            border: 1px solid #333;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
        }
        .amount {
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h3>Panel de Control (Simulador)</h3>
        <label>Monto (S/):</label>
        <input type="text" id="inputMonto" value="10.00" oninput="actualizarDatos()">

        <label>Nombre Destinatario:</label>
        <input type="text" id="inputNombre" value="Rosa Rojas" oninput="actualizarDatos()">

        <label>Método de Pago:</label>
        <select id="selectDestino" onchange="actualizarDatos()">
            <option value="YAPE">YAPE</option>
            <option value="PLIN">PLIN</option>
        </select>

        <div class="receipt">
            <div style="color: #00e676; font-weight: bold;">¡Lemoneaste!</div>
            <div class="amount">S/ <span id="viewMonto">10.00</span></div>
            <div id="viewNombre" style="font-weight: bold;">Rosa Rojas</div>
            <div style="font-size: 12px; color: #888; margin-top: 10px;">22 oct 2026 - 11:19 AM.</div>
            <hr style="border: 0; border-top: 1px solid #222; margin: 10px 0;">
            <div style="font-size: 12px; display: flex; justify-content: space-between;">
                <span>N° de celular</span><span>*** *** 067</span>
            </div>
            <div style="font-size: 12px; display: flex; justify-content: space-between; margin-top: 5px;">
                <span>Destino</span><span id="viewDestino">YAPE</span>
            </div>
            <div style="font-size: 12px; display: flex; justify-content: space-between; margin-top: 5px;">
                <span>N° de operación</span><span>2026...44672</span>
            </div>
        </div>
    </div>

    <script>
        // Lógica de manipulación del DOM en tiempo real (Client-side)
        function actualizarDatos() {
            document.getElementById('viewMonto').innerText = document.getElementById('inputMonto').value;
            document.getElementById('viewNombre').innerText = document.getElementById('inputNombre').value;
            document.getElementById('viewDestino').innerText = document.getElementById('selectDestino').value;
        }
    </script>

</body>
</html>
